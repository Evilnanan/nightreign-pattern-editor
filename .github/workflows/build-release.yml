name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build and publish the selected main commit (release/retry)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Check release version
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate versions and compare the entire push
        id: version
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-version.mjs

  test:
    name: Test frontend and Windows backend
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      # Release prerequisites must survive later ordinary pushes to main.
      group: tests-${{ github.workflow }}-${{ needs.plan.outputs.build == 'true' && github.sha || github.ref }}
      cancel-in-progress: ${{ needs.plan.outputs.build != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Check frontend compilation and translations
        run: npm run build
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Package Windows x64
    needs: [plan, test]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Build standalone executable
        run: npm run tauri -- build --ci --no-bundle -- --locked
      - name: Test embedded release configuration
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked icons::tests::release_loads_bundled_icon_config
      - name: Prepare standalone executable
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path output/release -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/nightreign-pattern-editor.exe -Destination "output/release/nightreign-pattern-editor_${appVersion}_windows-x64.exe"
      - name: Build Windows installer
        run: npm run tauri -- bundle --ci --bundles nsis
      - name: Prepare installer
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*_${appVersion}_*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer for $appVersion" }
          Copy-Item -LiteralPath $installers[0].FullName -Destination output/release
      - name: Upload executable and installer
        uses: actions/upload-artifact@v7
        with:
          name: nightreign-pattern-editor-windows-x64
          path: output/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create tag and publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.repository }}-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: nightreign-pattern-editor-windows-x64
          path: artifacts
      - name: Publish executable and installer at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/publish-release.mjs

[package]
name = "nightreign-pattern-editor"
version = "0.2.1"
description = "Nightreign Pattern Editor"
authors = ["Nightreign Pattern Editor contributors"]
edition = "2021"

[lib]
name = "nightreign_pattern_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
csv = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
zstd = "0.13"
tempfile = "3"
